# 版本族唯一事实源（ADR-0003 / ADR-0004）
#
# 格式：<族>=<minecraft版本>|<neoForge版本>|<java级别>
#   - 族由 targetMcVersion 推导：1.20.x→1.20 / 1.21.x→1.21 / 26.x→26.x
#   - build.gradle.kts（根）与 imp/build.gradle.kts 都读本文件，CI 矩阵也从这里取版本，
#     避免"三处各写一份表"导致漂移
#
# 选定依据（均已实测）：
#   1.20 → 1.20.6：数据组件与 ValueInput/ValueOutput 自 1.20.5 引入，而矢术系统依赖它；
#                   且 NeoForge 20.2.x 未发布 moddev 所需的 neoforge-moddev-bundle
#   1.21 → 1.21.1：生态最广的 LTS 型版本
#   26.x → 26.2  ：当前主力版本
1.20=1.20.6|20.6.144|21
1.21=1.21.1|21.1.209|21
26.x=26.2|26.2.0.75|25
