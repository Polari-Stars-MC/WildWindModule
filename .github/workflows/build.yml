name: Build

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Clean build, generate resources and run integration tests
        run: ./gradlew clean build collectMods :verification:runGameTest

      - name: Verify datagen reproducibility and source isolation
        shell: bash
        run: |
          set -euo pipefail
          find build/generated/datagen -type f -name '*.json' -not -path '*/.cache/*' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/datagen-before.txt"
          ./gradlew generateResources
          find build/generated/datagen -type f -name '*.json' -not -path '*/.cache/*' -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/datagen-after.txt"
          diff -u "$RUNNER_TEMP/datagen-before.txt" "$RUNNER_TEMP/datagen-after.txt"
          git diff --exit-code -- src
          test -z "$(git ls-files --others --exclude-standard -- src)"

      - name: Verify supported installations
        run: |
          for modules in core core,wilderness core,barren core,wilderness,barren; do
            ./gradlew :smoke:runGameTest -PtestModules="$modules"
          done

      - name: Verify distributable module set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build/distributions/mods -maxdepth 1 -name '*.jar' | wc -l)" -eq 3
          for module in core wilderness barren; do
            files=(build/distributions/mods/wild_wind_"${module}"-mc*.jar)
            test "${#files[@]}" -eq 1
            test -f "${files[0]}"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WildWind-test-reports
          path: |
            modules/*/build/test-results/**/*.xml
            modules/*/build/reports/tests/**
            modules/*/build/runs/**/results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload distributable mods
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WildWind-mc26.2
          path: build/distributions/mods/*.jar
          if-no-files-found: error
