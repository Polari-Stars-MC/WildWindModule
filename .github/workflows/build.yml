name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: '同时构建 1.20.6 / 1.21.1 的内容模块（当前预期失败，仅用于观测迁移进度）'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 主力版本：完整构建 + 测试 + 边界/配对守卫（必过）────────────────────
  primary:
    name: primary (26.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # build 会连带执行 checkImpBoundary 与 checkVersionPairing
      - name: Build (all modules)
        run: ./gradlew build -PtargetMcVersion=26.2 --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: wildwind-mc26.2
          path: |
            modules/*/build/libs/*.jar
            imp/build/libs/*.jar
          if-no-files-found: error

  # ── imp 多版本矩阵：三族 imp 必须都能编译（必过）──────────────────────────
  # 内容模块尚未按族迁移，所以这里只编 imp；迁移完成后改为 ./gradlew build
  imp-matrix:
    name: imp (mc${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['1.20.6', '1.21.1', '26.2']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build imp for ${{ matrix.target }}
        run: |
          ./gradlew :imp:build :imp:printImpVariant \
            -PtargetMcVersion=${{ matrix.target }} --console=plain

      - name: Upload imp jar
        uses: actions/upload-artifact@v4
        with:
          name: imp-mc${{ matrix.target }}
          path: imp/build/libs/*.jar
          if-no-files-found: error

  # ── 完整多版本内容构建（手动触发，允许失败）──────────────────────────────
  # 版本对写在这里，但由 checkVersionPairing 按 gradle/version-families.properties
  # 校验——YAML 与事实源不一致时构建会失败，不会产出假产物。
  content-matrix:
    name: content (mc${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_matrix }}
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.20.6'
            neo: '20.6.144'
          - target: '1.21.1'
            neo: '21.1.209'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build content for ${{ matrix.target }}
        run: |
          ./gradlew build \
            -PtargetMcVersion=${{ matrix.target }} \
            -PminecraftVersion=${{ matrix.target }} \
            -PneoVersion=${{ matrix.neo }} \
            --console=plain
