name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate client resources
        run: ./gradlew :datagen:runClientData

      - name: Generate server resources
        run: ./gradlew :datagen:runServerData

      - name: Verify generated resource snapshots
        run: |
          python3 scripts/sync_generated_resources.py
          git diff --exit-code -- src/core/resources src/wilderness/resources src/barren/resources

      - name: Build and run integration tests
        run: ./gradlew build collectMods :verification:runGameTest

      - name: Verify supported installations
        run: |
          for modules in core core,wilderness core,barren core,wilderness,barren; do
            ./gradlew :smoke:runGameTest -PtestModules="$modules"
          done

      - name: Upload distributable mods
        uses: actions/upload-artifact@v4
        with:
          name: WildWind-mc26.2
          path: build/distributions/mods/*.jar
